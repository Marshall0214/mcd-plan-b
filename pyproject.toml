[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-plan-b"
version = "0.1.0"
description = "麦麦补位：可解释的点餐替代方案 Skill"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mcd-plan-b = "mcd_plan_b.cli:main"

[tool.setuptools.packages.find]
include = ["mcd_plan_b*"]

[tool.setuptools.package-data]
mcd_plan_b = ["fixtures/*.json"]
